server {
    listen 8080;
    server_name _;
    root /srv/public/live;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # HTML: short cache so syncs show up quickly
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }
    # icon probes at any depth answer with the real root icons (never HTML)
    location ~ /favicon\.(ico|png)$ { try_files /favicon.$1 =404; add_header Cache-Control "public, max-age=2592000"; }
    location ~ /apple-touch-icon(-precomposed)?\.png$ { try_files /apple-touch-icon.png =404; add_header Cache-Control "public, max-age=2592000"; }
    location ~* \.(png|jpg|jpeg|webp|avif|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /search-index.json {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
    }
    error_page 404 /404.html;
}
