# Music Ed Cafe: static site (nginx) + tiny admin/sync sidecar.
# Caddy (box) routes musicedcafe.sebland.com -> web:20085, /admin* and /ebay/* -> admin:20086.
services:
  web:
    image: nginx:1.27-alpine
    container_name: musicedcafe-web
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "20085:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/srv/public:ro
    mem_limit: 32m
    cpus: 0.2
  admin:
    build: ./admin
    container_name: musicedcafe-admin
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "20086:8081"
    volumes:
      - ./:/app:ro
      - ./data:/app/data
      - ./public:/app/public
    mem_limit: 128m
    cpus: 0.5
